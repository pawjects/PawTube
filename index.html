<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="A clean, distraction-free video experience powered by Piped API and YouTube no-cookie embed with AMOLED liquid-glass UI" />
  <meta property="og:title" content="PawTube" />
  <meta property="og:description" content="A clean, distraction-free video experience powered by Piped API and YouTube no-cookie embed with AMOLED liquid-glass UI" />
  <meta name="theme-color" content="#000000" />
  <title>PawTube</title>

  <link rel="manifest" href="/public/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/public/favicon/pawtube_logo.png" />
  <link rel="apple-touch-icon" href="/public/assets/pawtube_logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/global.css" />
  <link rel="stylesheet" href="/src/styles/liquid-glass.css" />
  <link rel="stylesheet" href="/src/styles/responsive.css" />
</head>
<body>
  <div id="app">
    <!-- Top Bar -->
    <header class="header" id="header">
      <div class="header-left">
        <a class="logo" href="#/home" data-route="/home" aria-label="PawTube Home">
          <img src="/public/assets/pawtube_logo.png" alt="PawTube Logo" class="logo-icon" />
          <span class="logo-text">PawTube</span>
        </a>
      </div>

      <div class="header-center" id="header-center">
        <button class="icon-btn mobile-search-back" id="mobile-search-back" aria-label="Close search">
          <span class="material-symbols-rounded">arrow_back</span>
        </button>
        <form class="search-bar" id="search-form" action="javascript:void(0);">
          <div class="search-input-wrapper">
            <span class="material-symbols-rounded search-icon-hidden">search</span>
            <input type="search" id="header-search" placeholder="Search videos or paste link" autocomplete="off" spellcheck="false" />
            <button type="button" class="search-clear-btn" id="search-clear-btn" aria-label="Clear search" style="display:none;">
              <span class="material-symbols-rounded">close</span>
            </button>
          </div>
          <button type="submit" class="search-btn" id="search-btn" aria-label="Search">
            <span class="material-symbols-rounded">search</span>
          </button>
        </form>
        <div class="search-suggestions-dropdown" id="search-suggestions-dropdown"></div>
      </div>

      <div class="header-right">
        <button class="icon-btn mobile-search-trigger" id="mobile-search-trigger" aria-label="Open search">
          <span class="material-symbols-rounded">search</span>
        </button>
      </div>
    </header>

    <!-- Desktop Full Sidebar -->
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-nav">
        <a class="nav-item active" href="#/home" data-route="/home">
          <span class="material-symbols-rounded nav-icon">home</span>
          <span class="nav-label">Home</span>
        </a>
        <a class="nav-item" href="#/shorts" data-route="/shorts">
          <span class="material-symbols-rounded nav-icon">amp_stories</span>
          <span class="nav-label">Shorts</span>
        </a>
        <a class="nav-item" href="#/library" data-route="/library">
          <span class="material-symbols-rounded nav-icon">video_library</span>
          <span class="nav-label">Library</span>
        </a>
        <a class="nav-item" href="#/you" data-route="/you">
          <span class="material-symbols-rounded nav-icon">person</span>
          <span class="nav-label">You</span>
        </a>

        <div class="divider"></div>

        <div class="sidebar-footer">
          <p>PawTube &bull; Piped-Only Engine</p>
          <p>&copy; 2026 PawTube</p>
        </div>
      </nav>
    </aside>

    <!-- Desktop Mini Sidebar -->
    <aside class="mini-sidebar" id="mini-sidebar">
      <a class="mini-nav-item active" href="#/home" data-route="/home" title="Home">
        <span class="material-symbols-rounded">home</span>
        <span>Home</span>
      </a>
      <a class="mini-nav-item" href="#/shorts" data-route="/shorts" title="Shorts">
        <span class="material-symbols-rounded">amp_stories</span>
        <span>Shorts</span>
      </a>
      <a class="mini-nav-item" href="#/library" data-route="/library" title="Library">
        <span class="material-symbols-rounded">video_library</span>
        <span>Library</span>
      </a>
      <a class="mini-nav-item" href="#/you" data-route="/you" title="You">
        <span class="material-symbols-rounded">person</span>
        <span>You</span>
      </a>
    </aside>

    <!-- Main Content Mount -->
    <main class="main-content" id="main-content" aria-live="polite">
      <div style="padding:40px 24px;color:var(--text-secondary);text-align:center;">Loading PawTube...</div>
    </main>

    <!-- Floating Mini-Player -->
    <div class="mini-player" id="mini-player" style="display: none;">
      <div class="mini-player-thumb-wrap" id="mini-player-expand" title="Expand to watch">
        <img id="mini-player-thumb" src="" alt="Playing video" />
        <div class="mini-player-expand-overlay">
          <span class="material-symbols-rounded">expand_less</span>
        </div>
      </div>
      <div class="mini-player-info" id="mini-player-info">
        <div class="mini-player-title" id="mini-player-title">Title</div>
        <div class="mini-player-channel" id="mini-player-channel">Channel</div>
      </div>
      <div class="mini-player-controls">
        <button class="icon-btn mini-player-btn" id="mini-player-play-btn" aria-label="Play or Pause">
          <span class="material-symbols-rounded">pause</span>
        </button>
        <button class="icon-btn mini-player-btn" id="mini-player-close-btn" aria-label="Close player">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
    </div>

    <!-- Mobile Liquid-Glass Bottom Navigation -->
    <nav class="bottom-nav" id="bottom-nav" aria-label="Main Navigation">
      <div class="bnav-pill" id="bnav-pill"></div>
      <a class="bnav-item active" href="#/home" data-route="/home" aria-label="Home">
        <div class="bnav-icon-wrapper"><span class="material-symbols-rounded">home</span></div>
        <span class="bnav-label">Home</span>
      </a>
      <a class="bnav-item" href="#/shorts" data-route="/shorts" aria-label="Shorts">
        <div class="bnav-icon-wrapper"><span class="material-symbols-rounded">amp_stories</span></div>
        <span class="bnav-label">Shorts</span>
      </a>
      <a class="bnav-item" href="#/library" data-route="/library" aria-label="Library">
        <div class="bnav-icon-wrapper"><span class="material-symbols-rounded">video_library</span></div>
        <span class="bnav-label">Library</span>
      </a>
      <a class="bnav-item" href="#/you" data-route="/you" aria-label="You">
        <div class="bnav-icon-wrapper"><span class="material-symbols-rounded">person</span></div>
        <span class="bnav-label">You</span>
      </a>
    </nav>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>
  </div>

  <script type="module" src="/src/app/bootstrap/main.js?v=2"></script>
</body>
</html>
